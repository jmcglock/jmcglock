name: Update README cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [.github/workflows/cards.yml]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      STATS: username=jmcglock&show_icons=true&hide_border=true&hide_title=true&hide_rank=true&include_all_commits=true
      LANGS: username=jmcglock&layout=compact&langs_count=8&hide_border=true&card_width=467
    steps:
      - uses: actions/checkout@v7

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&bg_color=0e1210&text_color=e4e9e5&icon_color=5eea8c&title_color=5eea8c
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&bg_color=ffffff&text_color=1b211d&icon_color=2f9e5a&title_color=2f9e5a
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&bg_color=0e1210&text_color=e4e9e5&title_color=5eea8c
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&bg_color=ffffff&text_color=1b211d&title_color=2f9e5a
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
